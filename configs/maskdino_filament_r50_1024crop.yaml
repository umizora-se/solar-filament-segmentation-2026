# MaskDINO フィラメント・ベースライン (R50, 1024 ネイティブクロップ)
# _BASE_ は MaskDINO の 3-scale instance config。COCO 事前学習 checkpoint
#   maskdino_r50_50ep_300q_hid1024_3sd1_instance (mask 46.1AP) と構造が一致する。
# （4-scale はマスク解像度に有利だが 3sd1 checkpoint と projection 形状がズレるので baseline は 3s）
_BASE_: ../external/MaskDINO/configs/coco/instance-segmentation/maskdino_R50_bs16_50ep_3s.yaml

MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"  # train_filament.py が COCO 事前学習に差し替え
  # GONG jpeg 実測（3ch 同値, src/compute_pixel_stats.py で算出可）
  PIXEL_MEAN: [130.0, 130.0, 130.0]
  PIXEL_STD: [55.0, 55.0, 55.0]
  BACKBONE:
    FREEZE_AT: 2                # stem + stage1 を凍結（小データ過学習対策）
  SEM_SEG_HEAD:
    NUM_CLASSES: 1
  MaskDINO:
    NUM_OBJECT_QUERIES: 300   # COCO checkpoint と一致（max 26 本/画像なので余裕）
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OBJECT_MASK_THRESHOLD: 0.20   # 推論時の足切り（後処理チューニングで上書き）

DATASETS:
  TRAIN: ("filament_train_f0",)
  TEST: ("filament_val_f0",)

INPUT:
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "filament_instance"
  IMAGE_SIZE: 1024
  MIN_SCALE: 0.7
  MAX_SCALE: 1.3
  RANDOM_FLIP: "none"           # フリップ/回転は custom mapper 側で実施

SOLVER:
  # === VRAM 16GB 実測に基づく設定 ===
  #   1024crop bs2 + 勾配チェックポイント = 7.0 GiB (43%)  ← 採用
  #   1024crop bs3 = 10.2 GiB (63%) / bs4 = OOM
  #   個体数(7〜40)ではメモリはほぼ変わらない（エンコーダ支配のため）
  IMS_PER_BATCH: 2
  ACCUM_STEPS: 4               # 勾配累積 -> 実効バッチ 8
  BASE_LR: 0.0001
  WARMUP_ITERS: 500
  WARMUP_FACTOR: 0.01
  STEPS: (4000,)
  MAX_ITER: 5000               # 実効iter。5000*8/928 ≒ 43 epoch
                               # 実測 4.05 s/iter -> 学習 5.6時間 + 評価 5回x4分 ≒ 6.0時間
  CHECKPOINT_PERIOD: 1000
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 1000
  DETECTIONS_PER_IMAGE: 100

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 2               # 各ワーカが 2048^2 の画像とビットマスクを保持。ホストRAM 31GB

OUTPUT_DIR: "./work_dirs/r50_f0"

# 後処理（PQ 最適化は src/tune_postproc.py が上書き）
FILAMENT:
  # --- VRAM 安全弁（WSL2 は GPU メモリ溢れをフリーズにするので必須）---
  CUDA_MEM_FRACTION: 0.85      # 超えたら clean な CUDA OOM で落ちる
  GRAD_CHECKPOINT: True        # エンコーダの活性化を再計算（12.4 -> 7.0 GiB）
  # --- 評価コスト（フル2048推論は実測 4.5 s/枚、val 142枚で約11分）---
  EVAL_AFTER_TRAIN: True       # 学習終了時の最終評価
  EVAL_MAX_IMAGES: 50          # 学習中の評価は50枚に間引く(約4分)。最終値は --eval-only で取り直す
  # --- 後処理（PQ の限界解析より recall 寄りから探索する。設計書 §3.3）---
  SCORE_THR: 0.20
  MIN_AREA: 120          # 2048基準 px（面積 p01=209 を踏まえ小さめから）
  MASK_THR: 0.5
  DUMP_PRED: True        # val 推論の生予測(RLE+score)を work_dir に保存
